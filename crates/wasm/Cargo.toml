[package]
name = "covenants-wasm"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "wasm bindings for the covenants covenant builder"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
covenants-core = { path = "../core", features = ["wasm"] }
covenants-interp = { path = "../interp" }
bitcoin = { version = "0.32", features = ["serde"] }
# Shrinks libsecp256k1's precomputed tables from ~1MB to a few KB
# (ECMULT_WINDOW_SIZE 15 -> 4). Verification gets slower, which is
# irrelevant for the handful of checks a page does, and the download is
# what actually matters here.
secp256k1 = { version = "0.29", features = ["lowmemory"] }
serde = { version = "1", features = ["derive"] }
tsify = { version = "0.5", default-features = false, features = ["js"] }
wasm-bindgen = "0.2"
console_error_panic_hook = "0.1"

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-Oz", "--enable-bulk-memory", "--enable-nontrapping-float-to-int"]
