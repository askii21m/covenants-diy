name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup component add rustfmt
      - name: Cargo cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ hashFiles('Cargo.lock') }}
      - run: cargo fmt --all --check
      - run: cargo test --all

  web:
    runs-on: ubuntu-latest
    # .cargo/config.toml points the wasm32 C compiler at Homebrew LLVM, which
    # is what an Apple Silicon machine needs and no CI runner has. Cargo's
    # [env] yields to a variable already set, so these win here.
    env:
      CC_wasm32_unknown_unknown: clang
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      # wasm-pack is installed from crates.io rather than a third-party
      # action, so the only actions this workflow trusts are GitHub's own.
      - name: Cargo cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
            target
          key: wasm-${{ hashFiles('Cargo.lock') }}
      - name: Find the runner's llvm-ar
        run: |
          AR="$(command -v llvm-ar || true)"
          [ -n "$AR" ] || AR="$(ls -1 /usr/bin/llvm-ar-* 2>/dev/null | sort -V | tail -1 || true)"
          if [ -z "$AR" ]; then sudo apt-get update -qq && sudo apt-get install -y llvm; AR="$(command -v llvm-ar)"; fi
          echo "using $AR"
          echo "AR_wasm32_unknown_unknown=$AR" >> "$GITHUB_ENV"
      - name: Install wasm-pack
        run: command -v wasm-pack || cargo install wasm-pack --locked
      - run: npm ci
      - run: npm run wasm
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: node smoke.mjs
      - run: npm run build
